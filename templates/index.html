<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CommonBlog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1f2937 100%);
            color: #3079c2;
        }
        .app-shell {
            max-width: 1100px;
            margin: auto;
            padding: 2rem 1rem;
        }
        .chat-panel {
            min-height: 68vh;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.35);
            overflow: hidden;
        }
        .chat-header {
            border-bottom: 1px solid rgba(148, 163, 184, 0.15);
        }
        .chat-messages {
            padding: 1.5rem;
            height: 56vh;
            overflow-y: auto;
        }
        .message-bubble {
            max-width: 90%;
            padding: 1rem 1.2rem;
            border-radius: 20px;
            margin-bottom: 1rem;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.2);
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(148, 163, 184, 0.12);
        }
        .message-bubble .meta {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }
        .bg-accent {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: #fff;
        }
        .form-card {
            border-radius: 24px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(148, 163, 184, 0.15);
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.25);
        }
        .form-control {
            color: #111827;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(148, 163, 184, 0.35);
        }
        .form-control::placeholder {
            color: rgba(55, 65, 81, 0.45);
            opacity: 1;
            text-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
        }
        .form-control:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 0.2rem rgba(124, 58, 237, 0.25);
            color: #111827;
            background: rgba(255, 255, 255, 1);
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 text-white mb-1">CommonBlog</h1>
                <p class="text-light mb-0 mb-3">Live feed with chat-style posts and instant updates.</p>
            </div>
            <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
        </div>

        <div class="row g-4 chat-panel">
            <div class="col-lg-4 p-4 form-card">
                <div class="mb-4">
                    <span class="badge bg-accent py-2 px-3">New post</span>
                    <h2 class="h5 mt-3 text-white">Send a message</h2>
                    <p class="text-white">Write your post like a bot message and publish instantly.</p>
                </div>
                <form id="postForm" onsubmit="addPost(event)">
                    <div class="mb-3">
                        <label for="title" class="form-label text-white">Title</label>
                        <input id="title" class="form-control form-control-lg" placeholder="Type a headline" required>
                    </div>
                    <div class="mb-3">
                        <label for="content" class="form-label text-white">Message</label>
                        <textarea id="content" rows="6" placeholder="Write a bot-style message..." class="form-control form-control-lg" required></textarea>
                    </div>
                    <button class="btn btn-primary w-100 btn-lg">Publish</button>
                </form>
            </div>
            <div class="col-lg-8 d-flex flex-column">
                <div class="p-4 chat-header">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <div>
                            <h2 class="h5 text-white mb-1">Live feed</h2>
                            <p class="text-white mb-0">Recent posts appear here like modern bot messages.</p>
                        </div>
                        <span class="badge bg-success">Auto-refresh</span>
                    </div>
                </div>
                <div id="posts" class="chat-messages"></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
