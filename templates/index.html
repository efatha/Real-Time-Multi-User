<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CommonBlog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
</head>
<body class="home-page">
    <div class="app-shell">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 text-white mb-1">CommonBlog</h1>
                <p class="text-white mb-0 mb-3">Live feed with chat-style posts and instant updates.</p>
            </div>
            <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
        </div>

        <div class="row g-4 chat-panel">
            <div class="col-lg-4 p-4 form-card">
                <div class="mb-4">
                    <span class="badge bg-accent py-2 px-3">New post</span>
                    <h2 class="h5 mt-3 text-white">Send a message</h2>
                    <p class="text-white">Write your post like a bot message and publish instantly.</p>
                </div>
                <form id="postForm" onsubmit="addPost(event)">
                    <div class="mb-3">
                        <label for="title" class="form-label text-white">Title</label>
                        <input id="title" class="form-control form-control-lg" placeholder="Type a headline" required>
                    </div>
                    <div class="mb-3">
                        <label for="content" class="form-label text-white">Message</label>
                        <textarea id="content" rows="6" placeholder="Write a bot-style message..." class="form-control form-control-lg" required></textarea>
                    </div>
                    <button class="btn btn-primary w-100 btn-lg">Publish</button>
                </form>
            </div>
            <div class="col-lg-8 d-flex flex-column chat-column">
                <div class="p-4 chat-header">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <div>
                            <h2 class="h5 text-white mb-1">Live feed</h2>
                            <p class="text-white mb-0">Recent posts appear here like modern bot messages.</p>
                        </div>
                        <span class="badge bg-success">Auto-refresh</span>
                    </div>
                </div>
                <div id="posts" class="chat-messages"></div>
                <button id="scrollDownButton" class="scroll-down-btn" type="button" aria-label="Scroll to latest">
                    <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M10 14.5L4.5 9l1-1 4.5 4.5L14.5 8l1 1-5.5 5.5z" fill="currentColor"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
