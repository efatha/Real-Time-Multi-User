<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CommonBlog Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
</head>
<body class="auth-page">
    <div class="auth-card text-white">
        <div class="text-center mb-4">
            <p class="brand mb-1">COMMONBLOG</p>
            <h1 class="h4">Welcome back</h1>
            <p class="text-white-50">Quick sign-in and keep sharing your ideas.</p>
        </div>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label text-white-50">Username</label>
                <input name="username" placeholder="Enter username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-white-50">Password</label>
                <input name="password" type="password" placeholder="Enter password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign In</button>
        </form>
        <div class="text-center mt-4">
            <p class="text-light mb-2">New here?</p>
            <a href="/register" class="btn btn-outline-light w-100">Create account</a>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
