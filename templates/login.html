<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CommonBlog Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
        }
        .auth-card {
            max-width: 420px;
            margin: auto;
            margin-top: 6rem;
            padding: 2rem;
            background: rgba(15, 23, 42, 0.92);
            border-radius: 24px;
            border: 1px solid rgba(148, 163, 184, 0.16);
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.35);
        }
        .form-control {
            background: rgba(148, 163, 184, 0.08);
            border: 1px solid rgba(148, 163, 184, 0.18);
            color: #ffffff;
        }
        .form-control::placeholder {
            color: rgba(248, 250, 252, 0.45);
            opacity: 1;
            text-shadow: 0 1px 2px rgba(15, 23, 42, 0.4);
        }
        .form-control:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 0.2rem rgba(124, 58, 237, 0.25);
            background: rgba(15, 23, 42, 0.96);
            color: #ffffff;
        }
        .brand {
            letter-spacing: 0.16em;
            font-weight: 700;
            color: #a78bfa;
        }

        @media (max-width: 576px) {
            .auth-card {
                margin: 2rem 1rem;
                padding: 1.5rem;
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-card text-white">
        <div class="text-center mb-4">
            <p class="brand mb-1">COMMONBLOG</p>
            <h1 class="h4">Welcome back</h1>
            <p class="text-white-50">Quick sign-in and keep sharing your ideas.</p>
        </div>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label text-white-50">Username</label>
                <input name="username" placeholder="Enter username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-white-50">Password</label>
                <input name="password" type="password" placeholder="Enter password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign In</button>
        </form>
        <div class="text-center mt-4">
            <p class="text-light mb-2">New here?</p>
            <a href="/register" class="btn btn-outline-light w-100">Create account</a>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
