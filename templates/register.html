<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CommonBlog Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
        }
        .auth-card {
            max-width: 420px;
            margin: auto;
            margin-top: 6rem;
            padding: 2rem;
            background: rgba(15, 23, 42, 0.92);
            border-radius: 24px;
            border: 1px solid rgba(148, 163, 184, 0.16);
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.35);
        }
        .form-control {
            background: rgba(148, 163, 184, 0.08);
            border: 1px solid rgba(148, 163, 184, 0.18);
            color: #ffffff;
        }
        .form-control::placeholder {
            color: rgba(248, 250, 252, 0.45);
            opacity: 1;
            text-shadow: 0 1px 2px rgba(15, 23, 42, 0.4);
        }
        .form-control:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 0.2rem rgba(124, 58, 237, 0.25);
            background: rgba(15, 23, 42, 0.96);
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="auth-card text-white">
        <div class="text-center mb-4">
            <p class="text-uppercase text-white-50 mb-1">Create your account</p>
            <h1 class="h4 text-white-50">Register</h1>
            <p class="text-white-50">Start posting bot-style messages right away.</p>
        </div>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label text-white-50">Username</label>
                <input name="username" placeholder="Choose a username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-white-50">Password</label>
                <input name="password" type="password" placeholder="Choose a password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>
        <div class="text-center mt-4">
            <a href="/" class="btn btn-outline-light w-100">Back to Login</a>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
