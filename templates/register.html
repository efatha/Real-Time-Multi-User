<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CommonBlog Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
</head>
<body class="auth-page">
    <div class="auth-card text-white">
        <div class="text-center mb-4">
            <p class="text-uppercase text-white-50 mb-1">Create your account</p>
            <h1 class="h4 text-white-50">Register</h1>
            <p class="text-white-50">Start posting bot-style messages right away.</p>
        </div>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label text-white-50">Username</label>
                <input name="username" placeholder="Choose a username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-white-50">Password</label>
                <input name="password" type="password" placeholder="Choose a password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>
        <div class="text-center mt-4">
            <a href="/" class="btn btn-outline-light w-100">Back to Login</a>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
